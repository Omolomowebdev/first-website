<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeNest | Modern Homes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero">
    <div class="brand">
      <span class="brand-icon">⌂</span>
      <span>HomeNest</span>
    </div>

    <div class="content">
      <div class="text">
        <p class="eyebrow">FIND YOUR DREAM HOME</p>
        <h1>Modern Homes<br>for a Better<br>Life</h1>
        <p class="description">
          Discover beautiful, affordable, and<br>
          comfortable properties in the best<br>
          locations.
        </p>
      </div>

      <div class="house">
        <img src="house.png" alt="Modern home">
      </div>
    </div>

    <div class="search-bar">
      <div class="search-item">
        <span class="icon">⌖</span>
        <span>Location</span>
        <span class="arrow">⌄</span>
      </div>

      <div class="search-item">
        <span class="icon">⌂</span>
        <span>Property Type</span>
        <span class="arrow">⌄</span>
      </div>

      <button class="search-button">
        <span>⌕</span> Search
      </button>
    </div>
  </main>

</body>
</html>
